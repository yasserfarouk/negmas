name: CI
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: "Install the project (all extras except gui: pyqt5 has no wheel for some CI platforms/pythons)"
        run: uv sync --extra testing --extra dev --extra docs --extra egta
      - name: "Provision Chrome for plotly static export (kaleido>=1.0)"
        run: uv run plotly_get_chrome -y
      - name: "Install Jupyter Kernel"
        run: uv run -m ipykernel install --user --name=negmas
      - name: "Install Genius Bridge"
        run: uv run negmas genius-setup
      - name: "Run pytest for ${{ matrix.python-version }}"
        env:
          NEGMAS_IGNORE_TEST_NOTEBOOKS: "True"
          NEGMAS_FASTRUN: "True"
        run: "uv run pytest src/negmas tests/core || uv run pytest --last-failed src/negmas tests/core"

  minimal-deps:
    name: "Tests without optional dependencies (egta/gui not installed)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install "3.13"
      - name: "Install the project (testing extra only -- no gui/egta/docs/dev extras)"
        run: uv sync --extra testing
      - name: "Confirm optional game-theory dependencies are absent"
        run: |
          uv run python -c "
          import importlib
          for mod in ('nashpy', 'pygambit'):
              try:
                  importlib.import_module(mod)
                  raise SystemExit(f'{mod} unexpectedly importable in the minimal-deps job')
              except ImportError:
                  pass
          "
      - name: "Run pytest without optional dependencies (should skip nashpy-gated tests, not fail)"
        env:
          NEGMAS_IGNORE_TEST_NOTEBOOKS: "True"
          NEGMAS_FASTRUN: "True"
        run: "uv run pytest src/negmas tests/core -q"
